# Netlify: in the site settings, set "Base directory" to realtor.
# The build joins the properties edited in the admin panel (data/propiedades/) into data/listings.json.
[build]
  command = "node scripts/build-listings.js"
  publish = "."

# The properties change from the admin panel; always serve the latest file.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
