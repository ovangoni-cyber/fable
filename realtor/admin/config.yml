# Panel de administración de Ingrid Cabeza (Decap CMS).
# Cada propiedad es un archivo en realtor/data/propiedades/ y sus fotos van a realtor/img/propiedades/.
# Al publicar, Netlify ejecuta scripts/build-listings.js, que junta las propiedades en data/listings.json.
# Puesta en marcha: ver "Panel de administración" en el README.

backend:
  name: github
  repo: ovangoni-cyber/fable   # repositorio donde está la web
  branch: main                 # la rama que publica Netlify
  commit_messages:
    create: "Nueva propiedad {{slug}}"
    update: "Actualizar propiedad {{slug}}"
    delete: "Quitar propiedad {{slug}}"
    uploadMedia: "Subir foto {{path}}"
    deleteMedia: "Borrar foto {{path}}"

# Para probar en la computadora: `npx decap-server` en la raíz del repositorio. Solo se usa en localhost.
local_backend: true

locale: es
site_url: https://ingridcabeza.com      # PLACEHOLDER: el dominio real
display_url: https://ingridcabeza.com
logo_url: ../img/logo-mark.svg

media_folder: realtor/img/propiedades
public_folder: /img/propiedades

collections:
  - name: propiedades
    label: Propiedades
    label_singular: Propiedad
    description: Pulse una propiedad para cambiarla, o "+ Propiedad" para añadir otra. Al terminar, pulse "Publicar".
    folder: realtor/data/propiedades
    format: json
    extension: json
    create: true
    delete: true
    # El nombre del archivo es la dirección de la ficha: property.html?id=ic-2620
    slug: "{{ref}}"
    identifier_field: title
    summary: "{{ref}} · {{title}}"
    sortable_fields: [ref, title, price]
    editor:
      preview: false
    fields:
      - { name: title, label: "Título", widget: string, hint: "Ej.: Casa frente a la bahía con muelle privado" }
      - { name: ref, label: "Referencia", widget: string, hint: "Ej.: IC-2620. Una distinta para cada propiedad.", pattern: ['^[A-Za-z0-9-]+$', "Use letras, números y guiones"] }
      - name: status
        label: Estado
        widget: select
        default: sale
        options:
          - { label: "En venta", value: sale }
          - { label: "Recién listada (en venta)", value: new }
          - { label: "Bajo contrato", value: contract }
          - { label: "Vendida", value: sold }
          - { label: "Privada: sin precio y con fotos difuminadas", value: private }
          - { label: "En alquiler", value: rent }
      - name: type
        label: Tipo
        widget: select
        default: house
        options: [{ label: "Casa", value: house }, { label: "Condominio", value: condo }, { label: "Penthouse", value: penthouse }]
      - name: area
        label: Vecindario
        widget: select
        options:
          - { label: "Miami Beach y las islas", value: miami-beach }
          - { label: "Key Biscayne", value: key-biscayne }
          - { label: "Coral Gables", value: coral-gables }
          - { label: "Coconut Grove", value: coconut-grove }
          - { label: "Pinecrest", value: pinecrest }
          - { label: "Golden Beach y Sunny Isles", value: north-beaches }
          - { label: "Brickell", value: brickell }
      - { name: price, label: "Precio en dólares", widget: number, value_type: int, min: 0, hint: "Solo números. Ej.: 18950000. Si está en alquiler, el precio por mes." }
      - { name: beds, label: "Habitaciones", widget: number, value_type: int, min: 0 }
      - { name: baths, label: "Baños", widget: number, value_type: float, min: 0, step: 0.5, hint: "Medio baño = 0.5" }
      - { name: sqft, label: "Superficie (pies²)", widget: number, value_type: int, min: 0 }
      - name: imgs
        label: Fotos
        label_singular: foto
        widget: list
        min: 1
        collapsed: false
        hint: "La primera es la principal. Arrástrelas para cambiar el orden."
        field: { name: img, label: Foto, widget: image, choose_url: false }
      - { name: desc, label: "Descripción", widget: text }
      - { name: features, label: "Características", widget: text, required: false, hint: "Una por línea. Ej.: Ascensor y cava" }
      - { name: exclusive, label: "Exclusiva", widget: boolean, default: false, required: false }
      - { name: featured, label: "Destacar arriba en la portada", widget: boolean, default: false, required: false, hint: "Marque una sola." }
      - name: details
        label: Más detalles
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: place, label: "Ubicación que se muestra", widget: string, required: false, hint: "Ej.: Sunset Islands, Miami Beach. Si lo deja vacío, se usa el vecindario." }
          - name: water
            label: Frente al agua
            widget: select
            default: none
            required: false
            options:
              - { label: "No", value: none }
              - { label: "Océano", value: ocean }
              - { label: "Bahía", value: bay }
              - { label: "Canal con salida al mar", value: canal }
          - { name: frontage, label: "Pies de frente al agua", widget: number, value_type: int, min: 0, required: false }
          - { name: lot, label: "Lote (acres)", widget: number, value_type: float, min: 0, step: 0.01, required: false }
          - { name: year, label: "Año de construcción", widget: number, value_type: int, min: 1900, max: 2100, required: false }
          - { name: listed, label: "Fecha de publicación", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false,
              picker_utc: true, default: "{{now}}", required: false, hint: "Las más recientes salen primero." }
      - name: en
        label: Textos en inglés
        widget: object
        collapsed: true
        required: false
        hint: "Si lo deja vacío, la web en inglés muestra el texto en español."
        fields:
          - { name: title, label: "Título en inglés", widget: string, required: false }
          - { name: desc, label: "Descripción en inglés", widget: text, required: false }
          - { name: features, label: "Características en inglés", widget: text, required: false, hint: "Una por línea." }
