# Panel de administración de Ingrid Cabeza (Decap CMS).
# Cada propiedad es un archivo en realtor/data/propiedades/ y sus fotos van a realtor/img/propiedades/.
# Los textos, fotos y datos de contacto de la web están en realtor/data/web/.
# Al publicar, Netlify ejecuta scripts/build-site.js (aplica los textos a las páginas) y
# scripts/build-listings.js (junta las propiedades en data/listings.json).
# Puesta en marcha: ver "Panel de administración" en el README.

backend:
  name: github
  repo: ovangoni-cyber/fable   # repositorio donde está la web
  branch: main                 # la rama que publica Netlify
  commit_messages:
    create: "Nueva propiedad {{slug}}"
    update: "Actualizar propiedad {{slug}}"
    delete: "Quitar propiedad {{slug}}"
    uploadMedia: "Subir foto {{path}}"
    deleteMedia: "Borrar foto {{path}}"

# Para probar en la computadora: `npx decap-server` en la raíz del repositorio. Solo se usa en localhost.
local_backend: true

locale: es
site_url: https://ingridcabeza.com      # PLACEHOLDER: el dominio real
display_url: https://ingridcabeza.com
logo_url: ../img/logo-mark.svg

media_folder: realtor/img/propiedades
public_folder: /img/propiedades

collections:
  - name: propiedades
    label: Propiedades
    label_singular: Propiedad
    description: Pulse una propiedad para cambiarla, o "+ Propiedad" para añadir otra. Al terminar, pulse "Publicar".
    folder: realtor/data/propiedades
    format: json
    extension: json
    create: true
    delete: true
    # El nombre del archivo es la dirección de la ficha: property.html?id=ic-2620
    slug: "{{ref}}"
    identifier_field: title
    summary: "{{ref}} · {{title}}"
    sortable_fields: [ref, title, price]
    editor:
      preview: false
    fields:
      - { name: title, label: "Título", widget: string, hint: "Ej.: Casa frente a la bahía con muelle privado" }
      - { name: ref, label: "Referencia", widget: string, hint: "Ej.: IC-2620. Una distinta para cada propiedad.", pattern: ['^[A-Za-z0-9-]+$', "Use letras, números y guiones"] }
      - name: status
        label: Estado
        widget: select
        default: sale
        options:
          - { label: "En venta", value: sale }
          - { label: "Recién listada (en venta)", value: new }
          - { label: "Bajo contrato", value: contract }
          - { label: "Vendida", value: sold }
          - { label: "Privada: sin precio y con fotos difuminadas", value: private }
          - { label: "En alquiler", value: rent }
      - name: type
        label: Tipo
        widget: select
        default: house
        options: [{ label: "Casa", value: house }, { label: "Condominio", value: condo }, { label: "Penthouse", value: penthouse }]
      - name: area
        label: Vecindario
        widget: relation
        collection: web
        file: vecindarios
        value_field: "zonas.*.id"
        search_fields: ["zonas.*.nombre"]
        display_fields: ["zonas.*.nombre"]
        options_length: 50
        hint: "Los vecindarios se cambian en Web → Vecindarios."
      - { name: price, label: "Precio en dólares", widget: number, value_type: int, min: 0, hint: "Solo números. Ej.: 18950000. Si está en alquiler, el precio por mes." }
      - { name: beds, label: "Habitaciones", widget: number, value_type: int, min: 0 }
      - { name: baths, label: "Baños", widget: number, value_type: float, min: 0, step: 0.5, hint: "Medio baño = 0.5" }
      - { name: sqft, label: "Superficie (pies²)", widget: number, value_type: int, min: 0 }
      - name: imgs
        label: Fotos
        label_singular: foto
        widget: list
        min: 1
        collapsed: false
        hint: "La primera es la principal. Arrástrelas para cambiar el orden."
        field: { name: img, label: Foto, widget: image, choose_url: false }
      - { name: video_url, label: "Vídeo: enlace de YouTube o Vimeo", widget: string, required: false,
          hint: "Pegue el enlace del vídeo. Ej.: https://www.youtube.com/watch?v=… Es la mejor opción para vídeos largos." }
      - { name: video_file, label: "Vídeo: subir un archivo", widget: file, required: false, choose_url: false,
          hint: "Si no tiene enlace, suba un vídeo corto en MP4 de menos de 50 MB. Si rellena los dos, se usa el enlace." }
      - { name: desc, label: "Descripción", widget: text }
      - { name: features, label: "Características", widget: text, required: false, hint: "Una por línea. Ej.: Ascensor y cava" }
      - { name: exclusive, label: "Exclusiva", widget: boolean, default: false, required: false }
      - { name: featured, label: "Destacar arriba en la portada", widget: boolean, default: false, required: false, hint: "Marque una sola." }
      - name: details
        label: Más detalles
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: place, label: "Ubicación que se muestra", widget: string, required: false, hint: "Ej.: Sunset Islands, Miami Beach. Si lo deja vacío, se usa el vecindario." }
          - name: water
            label: Frente al agua
            widget: select
            default: none
            required: false
            options:
              - { label: "No", value: none }
              - { label: "Océano", value: ocean }
              - { label: "Bahía", value: bay }
              - { label: "Canal con salida al mar", value: canal }
          - { name: frontage, label: "Pies de frente al agua", widget: number, value_type: int, min: 0, required: false }
          - { name: lot, label: "Lote (acres)", widget: number, value_type: float, min: 0, step: 0.01, required: false }
          - { name: year, label: "Año de construcción", widget: number, value_type: int, min: 1900, max: 2100, required: false }
          - { name: listed, label: "Fecha de publicación", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false,
              picker_utc: true, default: "{{now}}", required: false, hint: "Las más recientes salen primero." }
      - name: en
        label: Textos en inglés
        widget: object
        collapsed: true
        required: false
        hint: "Si lo deja vacío, la web en inglés muestra el texto en español."
        fields:
          - { name: title, label: "Título en inglés", widget: string, required: false }
          - { name: desc, label: "Descripción en inglés", widget: text, required: false }
          - { name: features, label: "Características en inglés", widget: text, required: false, hint: "Una por línea." }

  # ------------------------------------------------------------ textos, fotos y datos de la web
  - name: web
    label: Textos y datos de la web
    label_singular: Sección
    description: Los textos, fotos y datos de contacto de la web. Pulse una sección, cambie lo que necesite y pulse "Publicar". Si deja vacío un texto en inglés, la web en inglés usa el español.
    delete: false
    editor:
      preview: false
    files:
      - name: contacto
        label: Datos de contacto
        file: realtor/data/web/contacto.json
        fields:
          - { name: telefono, label: "Teléfono", widget: string, hint: "Ej.: 786 626 4910. Sale en la cabecera, en Contacto y en el botón Llamar." }
          - { name: whatsapp, label: "WhatsApp", widget: string, required: false, hint: "Déjelo vacío si es el mismo número que el teléfono." }
          - { name: email, label: "Correo", widget: string }
          - name: oficina
            label: Oficina
            widget: object
            fields:
              - { name: calle, label: "Dirección (calle y número)", widget: string, required: false, hint: "Opcional. Ej.: 1234 Cape Coral Pkwy E, Suite 5" }
              - { name: ciudad, label: "Ciudad", widget: string }
              - { name: estado, label: "Estado", widget: string, default: "FL" }
              - { name: cp, label: "Código postal", widget: string, required: false }
          - { name: licencia, label: "Número de licencia", widget: string, hint: "Ej.: SL3644016. Sale en Sobre mí y en el pie de página." }
          - { name: agencia, label: "Nombre de la agencia (broker)", widget: string, required: false, hint: "En Florida la publicidad debe llevar el nombre de la agencia. Sale en el pie de página." }
          - { name: titulo, label: "Título de la sección Contacto", widget: string }
          - { name: texto, label: "Texto de la sección Contacto", widget: text }
          - name: en
            label: Textos en inglés
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: titulo, label: "Título en inglés", widget: string, required: false }
              - { name: texto, label: "Texto en inglés", widget: text, required: false }
          - { name: formularios, label: "Dirección de envío de los formularios (avanzado)", widget: string, required: false, hint: "La dirección que le da su servicio de formularios (por ejemplo Formspree) para recibir los mensajes de la web en su correo. Vacío: los formularios no envían." }

      - name: portada
        label: Portada
        file: realtor/data/web/portada.json
        fields:
          - { name: eyebrow, label: "Línea pequeña de arriba", widget: string, hint: "Ej.: Bienes raíces de lujo en Florida" }
          - { name: frase, label: "Frase principal", widget: text }
          - { name: subtitulo, label: "Texto debajo", widget: text }
          - name: en
            label: Textos en inglés
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Línea pequeña en inglés", widget: string, required: false }
              - { name: frase, label: "Frase principal en inglés", widget: text, required: false }
              - { name: subtitulo, label: "Texto debajo en inglés", widget: text, required: false }
          - name: cifras
            label: Cifras (la franja con números)
            widget: object
            collapsed: true
            fields:
              - { name: mostrar, label: "Mostrar las cifras", widget: boolean, default: true, required: false }
              - name: lista
                label: Cifras
                label_singular: cifra
                widget: list
                max: 4
                required: false
                summary: "{{fields.numero}} {{fields.texto}}"
                fields:
                  - { name: numero, label: "Número", widget: string, hint: "Ej.: 214, $1.2B o 38%" }
                  - { name: texto, label: "Texto", widget: string, hint: "Ej.: casas vendidas" }
                  - { name: texto_en, label: "Texto en inglés", widget: string, required: false }
          - name: google
            label: Google y enlaces compartidos
            widget: object
            collapsed: true
            hint: "El título y la descripción que salen en Google y al compartir la web por WhatsApp."
            fields:
              - { name: titulo, label: "Título", widget: string }
              - { name: descripcion, label: "Descripción", widget: text }
              - { name: titulo_en, label: "Título en inglés", widget: string, required: false }
              - { name: descripcion_en, label: "Descripción en inglés", widget: text, required: false }

      - name: vecindarios
        label: Vecindarios
        file: realtor/data/web/vecindarios.json
        fields:
          - { name: eyebrow, label: "Línea pequeña de arriba", widget: string }
          - { name: titulo, label: "Título de la sección", widget: string }
          - { name: intro, label: "Texto de la sección", widget: text }
          - name: en
            label: Textos en inglés
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Línea pequeña en inglés", widget: string, required: false }
              - { name: titulo, label: "Título en inglés", widget: string, required: false }
              - { name: intro, label: "Texto en inglés", widget: text, required: false }
          - name: zonas
            label: Vecindarios
            label_singular: vecindario
            widget: list
            min: 1
            summary: "{{fields.nombre}}"
            hint: "Salen en la portada, en el buscador y en el formulario de cada propiedad. Arrástrelos para cambiar el orden."
            fields:
              - { name: nombre, label: "Nombre", widget: string }
              - { name: id, label: "Identificador", widget: string, pattern: ['^[a-z0-9-]+$', "Solo minúsculas, números y guiones"], hint: "Ej.: cape-coral. Si ya hay propiedades en este vecindario, no lo cambie." }
              - { name: texto, label: "Descripción", widget: text }
              - { name: foto, label: "Foto", widget: image, required: false, choose_url: false, hint: "Vertical, de unos 1000 × 1250 píxeles." }
              - { name: portada, label: "Mostrar en la portada", widget: boolean, default: true, required: false, hint: "Si lo desactiva, sigue en el buscador pero no sale en la portada." }
              - { name: nombre_en, label: "Nombre en inglés", widget: string, required: false }
              - { name: texto_en, label: "Descripción en inglés", widget: text, required: false }

      - name: servicios
        label: Cómo trabajo (Comprar y vender)
        file: realtor/data/web/servicios.json
        fields:
          - { name: eyebrow, label: "Línea pequeña de arriba", widget: string }
          - { name: titulo, label: "Título de la sección", widget: string }
          - name: en
            label: Textos en inglés
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Línea pequeña en inglés", widget: string, required: false }
              - { name: titulo, label: "Título en inglés", widget: string, required: false }
          - name: comprar
            label: "Pestaña Comprar"
            label_singular: punto
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: "Título", widget: string }
              - { name: texto, label: "Texto", widget: text }
              - { name: titulo_en, label: "Título en inglés", widget: string, required: false }
              - { name: texto_en, label: "Texto en inglés", widget: text, required: false }
          - name: vender
            label: "Pestaña Vender"
            label_singular: punto
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: "Título", widget: string }
              - { name: texto, label: "Texto", widget: text }
              - { name: titulo_en, label: "Título en inglés", widget: string, required: false }
              - { name: texto_en, label: "Texto en inglés", widget: text, required: false }
          - name: exterior
            label: "Pestaña Desde el exterior"
            label_singular: punto
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: "Título", widget: string }
              - { name: texto, label: "Texto", widget: text }
              - { name: titulo_en, label: "Título en inglés", widget: string, required: false }
              - { name: texto_en, label: "Texto en inglés", widget: text, required: false }

      - name: valoracion
        label: Valor de su casa
        file: realtor/data/web/valoracion.json
        fields:
          - { name: eyebrow, label: "Línea pequeña de arriba", widget: string }
          - { name: titulo, label: "Título", widget: string }
          - { name: texto, label: "Texto", widget: text }
          - name: en
            label: Textos en inglés
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Línea pequeña en inglés", widget: string, required: false }
              - { name: titulo, label: "Título en inglés", widget: string, required: false }
              - { name: texto, label: "Texto en inglés", widget: text, required: false }

      - name: sobre-mi
        label: Sobre mí
        file: realtor/data/web/sobre-mi.json
        fields:
          - { name: foto, label: "Foto en la llave", widget: image, choose_url: false, hint: "Cuadrada, con la cara en el centro, de al menos 560 × 560 píxeles." }
          - { name: eyebrow, label: "Línea pequeña de arriba", widget: string }
          - { name: titulo, label: "Título", widget: string }
          - name: parrafos
            label: Párrafos
            label_singular: párrafo
            widget: list
            min: 1
            summary: "{{fields.texto}}"
            fields:
              - { name: texto, label: "Texto", widget: text }
              - { name: texto_en, label: "Texto en inglés", widget: text, required: false }
          - { name: idiomas, label: "Idiomas", widget: string }
          - { name: especialidad, label: "Especialidad", widget: string }
          - name: en
            label: Textos en inglés
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Línea pequeña en inglés", widget: string, required: false }
              - { name: titulo, label: "Título en inglés", widget: string, required: false }
              - { name: idiomas, label: "Idiomas en inglés", widget: string, required: false }
              - { name: especialidad, label: "Especialidad en inglés", widget: string, required: false }

      - name: testimonios
        label: Testimonios
        file: realtor/data/web/testimonios.json
        fields:
          - { name: mostrar, label: "Mostrar los testimonios", widget: boolean, default: true, required: false }
          - { name: eyebrow, label: "Línea pequeña de arriba", widget: string }
          - { name: titulo, label: "Título", widget: string }
          - name: en
            label: Textos en inglés
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Línea pequeña en inglés", widget: string, required: false }
              - { name: titulo, label: "Título en inglés", widget: string, required: false }
          - name: lista
            label: Testimonios
            label_singular: testimonio
            widget: list
            summary: "{{fields.iniciales}} · {{fields.quien}}"
            fields:
              - { name: texto, label: "Lo que dice el cliente", widget: text }
              - { name: iniciales, label: "Iniciales", widget: string, hint: "Ej.: M.P." }
              - { name: quien, label: "Quién es", widget: string, hint: "Ej.: Vendedores, Cape Coral" }
              - { name: texto_en, label: "Lo que dice, en inglés", widget: text, required: false }
              - { name: quien_en, label: "Quién es, en inglés", widget: string, required: false }

      - name: pagina-propiedades
        label: Página de propiedades
        file: realtor/data/web/pagina-propiedades.json
        fields:
          - { name: titulo, label: "Título", widget: string }
          - { name: texto, label: "Texto debajo del título", widget: text }
          - name: en
            label: Textos en inglés
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: titulo, label: "Título en inglés", widget: string, required: false }
              - { name: texto, label: "Texto en inglés", widget: text, required: false }
          - name: google
            label: Google y enlaces compartidos
            widget: object
            collapsed: true
            fields:
              - { name: titulo, label: "Título", widget: string }
              - { name: descripcion, label: "Descripción", widget: text }
              - { name: titulo_en, label: "Título en inglés", widget: string, required: false }
              - { name: descripcion_en, label: "Descripción en inglés", widget: text, required: false }
