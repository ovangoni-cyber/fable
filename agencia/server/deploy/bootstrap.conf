# Used until the certificate exists: the site over plain HTTP, plus the Let's Encrypt challenge.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 http://ingrid-realtor.com$request_uri; }
}
server {
    listen 80;
    listen [::]:80;
    server_name ingrid-realtor.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    include /etc/nginx/ingrid/site.inc;
}
