# https://ingrid-realtor.com. Every other address (http, www, the IP) redirects there.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://ingrid-realtor.com$request_uri; }
}
server {
    # HTTPS for unknown names (such as the bare IP): refuse, there is no certificate for them.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ingrid-realtor.com;
    ssl_certificate /etc/letsencrypt/live/ingrid-realtor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingrid-realtor.com/privkey.pem;
    return 301 https://ingrid-realtor.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ingrid-realtor.com;
    ssl_certificate /etc/letsencrypt/live/ingrid-realtor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingrid-realtor.com/privkey.pem;
    include /etc/nginx/ingrid/site.inc;
}
